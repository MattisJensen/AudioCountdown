server { listen 80; root /usr/share/nginx/html; index index.html; client_max_body_size 20m; location / { try_files $uri /index.html; } location /api/ { access_log off; proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ''; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 86400; } }
